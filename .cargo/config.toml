[build]
jobs = -1
warnings = "deny"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[doc]
rustdocflags = ["-D", "warnings"]

[env]
RUST_BACKTRACE = "1"

[net]
retry = 3

[alias]
lint = "clippy --workspace --all-features --all-targets -- -D warnings"
