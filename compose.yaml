name: nim

include:
  - compose.observability.yaml

services:
  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: pg_isready -U admin -d main
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    container_name: nats
    image: nats:latest
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - 4222:4222
      - 8222:8222
    volumes:
      - nats:/data

  gateway:
    container_name: nim-gateway
    build:
      context: .
      dockerfile: bins/nim-gateway/Dockerfile
    ports:
      - 9999:8080
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
      NIM_CACHE: /.cache
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
      - ./.cache:/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 5s
      start_period: 5m
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  text:
    container_name: nim-text
    build:
      context: .
      dockerfile: bins/nim-text/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
      NIM_CACHE: /.cache
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
      - ./.cache:/.cache
    depends_on:
      gateway:
        condition: service_healthy

  audio:
    container_name: nim-audio
    build:
      context: .
      dockerfile: bins/nim-audio/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
      NIM_CACHE: /.cache
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
      - ./.cache:/.cache
    depends_on:
      gateway:
        condition: service_healthy

  vision:
    container_name: nim-vision
    build:
      context: .
      dockerfile: bins/nim-vision/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
      NIM_CACHE: /.cache
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
      - ./.cache:/.cache
    depends_on:
      gateway:
        condition: service_healthy

  encode:
    container_name: nim-encode
    build:
      context: .
      dockerfile: bins/nim-encode/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
      NIM_CACHE: /.cache
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
      - ./.cache:/.cache
    depends_on:
      gateway:
        condition: service_healthy

  sleep:
    container_name: nim-sleep
    build:
      context: .
      dockerfile: bins/nim-sleep/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
      NIM_CACHE: /.cache
    volumes:
      - .:/app
      - /app/target
      - ./.cache:/.cache
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  nats:
  staging:
