<nim-memory-details>
    <section id="memory-details" role="region" aria-labelledby="memory-detail-title" hidden>
        <div class="memory-detail-header">
            <p class="memory-kicker">Memory record</p>
            <button
                id="memory-detail-close"
                type="button"
                aria-label="Close memory details"
                @click="dismissMemoryDetails()"
            >
                ×
            </button>
        </div>
        <h3 id="memory-detail-title"></h3>
        <div id="memory-detail-art" aria-hidden="true" hidden></div>
        <p id="memory-detail-meta"></p>
        <p id="memory-detail-summary"></p>
        <button id="memory-expand" type="button" hidden @click="expandMemoryGraph()">Expand relations</button>
    </section>
</nim-memory-details>
