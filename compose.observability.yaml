services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --log.level=error
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  loki:
    container_name: loki
    image: grafana/loki:latest
    ports:
      - 3100:3100
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki:/loki

  tempo:
    container_name: tempo
    image: grafana/tempo:latest
    command:
      - -config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      GF_LOG_LEVEL: error
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  nats-exporter:
    container_name: nats-exporter
    image: natsio/prometheus-nats-exporter:latest
    command: ["-varz", "-jsz=all", "http://nats:8222"]
    depends_on:
      - nats

  telegraf:
    container_name: telegraf
    image: telegraf:latest
    user: "0:0"
    entrypoint: ["telegraf"]
    command: ["--config", "/etc/telegraf/telegraf.conf"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nim}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    ports:
      - 12345:12345
      - 4317:4317
      - 4318:4318
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nim}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  grafana:
  prometheus:
  loki:
  tempo:
  alloy:
