[package]
name = "nim-ai"
description = "NIM AI routines (embeddings, entities, keywords, PII, sentiment, summarization)"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
categories.workspace = true
repository.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
audio = ["dep:hound", "dep:rustfft"]
vision = ["dep:image"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "charset", "default-tls", "http2", "json", "system-proxy"] }
url = { workspace = true }
tracing = { workspace = true }

candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }
candle-transformers = { version = "0.11" }
tokenizers = { version = "0.22" }
hf-hub = { version = "0.5" }

image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"], optional = true }
hound = { version = "3.5", optional = true }
rustfft = { version = "6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }
candle-transformers = { version = "0.11", features = ["accelerate"] }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
candle-core = { version = "0.11", features = ["mkl"] }
candle-nn = { version = "0.11", features = ["mkl"] }
candle-transformers = { version = "0.11", features = ["mkl"] }
