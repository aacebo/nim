name: nim

services:
  postgres:
    container_name: nim-postgres
    image: pgvector/pgvector:pg17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: pg_isready -U admin -d main
      interval: 10s
      timeout: 5s
      retries: 5

  nimd:
    container_name: nimd
    image: rust:alpine
    command: cargo run -p nimd --release
    working_dir: /app
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
    volumes:
      - type: bind
        source: ./
        target: /app
    depends_on:
      postgres:
        condition: service_healthy
