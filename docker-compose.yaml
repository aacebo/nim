name: nim

services:
  postgres:
    container_name: nim-postgres
    image: pgvector/pgvector:pg17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: pg_isready -U admin -d main
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    container_name: nim-nats
    image: nats:latest
    command: ["-js", "-sd", "/data"]
    ports:
      - 4222:4222
      - 8222:8222
    volumes:
      - nats:/data

  gateway:
    container_name: nim-gateway
    build:
      context: .
      dockerfile: bins/Dockerfile
    command: cargo run -p nim-gateway --release
    working_dir: /app
    ports:
      - 3000:8080
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      OPENSSL_STATIC: 1
      RUST_LOG: info
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  text:
    container_name: nim-text
    build:
      context: .
      dockerfile: bins/Dockerfile
    command: cargo run -p nim-text --release
    working_dir: /app
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  audio:
    container_name: nim-audio
    build:
      context: .
      dockerfile: bins/Dockerfile
    command: cargo run -p nim-audio --release
    working_dir: /app
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      OPENSSL_STATIC: 1
      RUST_LOG: info
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  vision:
    container_name: nim-vision
    build:
      context: .
      dockerfile: bins/Dockerfile
    command: cargo run -p nim-vision --release
    working_dir: /app
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RUST_LOG: info
    volumes:
      - .:/app
      - /app/target
      - staging:/.staging
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  nats:
  staging:
