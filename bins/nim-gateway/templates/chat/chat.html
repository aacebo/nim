<template id="chat-template">
    <div class="action-view" data-chat="{{ self.chat|json }}" data-messages="{{ self.messages|json }}">
        <section id="action-panel" aria-label="Chat" :inert="hud !== 'panel'">
            <form id="chat-form" hidden :hidden="!showChatForm" @submit.prevent="sendChatMessage()">
                <input
                    id="chat-files"
                    x-ref="chatFiles"
                    type="file"
                    accept="audio/*,image/*,text/*,.txt,.md,.csv,.json,.log,.yaml,.yml"
                    multiple
                    hidden
                    @change="selectChatFiles($event)"
                >
                <div class="chat-composer" :class="{ 'is-multiline': draft.trim().includes('\n') }">
                    <div id="chat-attachment-drawer" hidden>
                        <span class="chat-attachment-handle" aria-hidden="true"></span>
                        <ul id="chat-attachments" aria-label="Attachments"></ul>
                    </div>
                    <span class="chat-input-field">
                        <textarea id="chat-input" aria-label="Message" placeholder="Ask me anything…" rows="1" x-model="draft" @input="clearChatError()"></textarea>
                    </span>
                    <footer class="chat-composer-footer">
                        <div class="chat-composer-options">
                            <button id="chat-back" type="button" aria-label="Back" title="Back" @click="backToHub()">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h10"/></svg>
                            </button>
                            <button id="chat-attach" type="button" aria-label="Attach audio, images, or text files" title="Attach files" @click="$refs.chatFiles.click()">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12 7-7a4 4 0 0 1 6 6l-9 9a6 6 0 0 1-9-9l9-9"/></svg>
                            </button>
                        </div>
                        <div class="chat-composer-send-actions">
                            <span class="chat-context" aria-label="Context window: 50% used">
                                <span class="chat-context-label">Context window</span>
                                <span class="chat-context-track" role="progressbar" aria-label="Context window" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="chat-context-progress"></span></span>
                            </span>
                            <button id="chat-send" type="button" :aria-label="draft.trim() ? 'Send message' : 'Start voice conversation'" :title="draft.trim() ? 'Send message' : 'Start voice conversation'" @click="if (draft.trim()) sendChatMessage()">
                                <svg class="chat-primary-icon" :class="{ 'is-hidden': draft.trim() }" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4M9 7v10M13 4v16M17 7v10M21 10v4"/></svg>
                                <svg class="chat-primary-icon" :class="{ 'is-hidden': !draft.trim() }" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                            </button>
                        </div>
                    </footer>
                </div>
            </form>
            <p id="chat-error" role="alert"></p>
            <p id="chat-warning" role="status"></p>
        </section>
        {% include "chat/transcript/transcript.html" %}
    </div>
</template>
