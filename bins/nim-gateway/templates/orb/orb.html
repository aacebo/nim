<button
    id="orb-trigger"
    type="button"
    aria-label="Orb actions"
    aria-controls="orb-hub"
    :aria-expanded="hud === 'hub'"
    :inert="hud === 'memory'"
    @click="toggleOrb()"
>
    <canvas id="orb" aria-hidden="true"></canvas>
</button>
<nav id="orb-hub" aria-label="Orb actions" :inert="hud !== 'hub'">
    <button
        id="chat-action"
        class="hub-action"
        type="button"
        aria-controls="action-panel"
        @click="chooseAction($el)"
    >
        <svg class="hub-symbol" viewBox="0 0 32 32" aria-hidden="true">
            <use href="#hud-cube"/>
        </svg>
        <span class="hub-label">Chat</span>
    </button>
    <button
        id="memory-action"
        class="hub-action"
        type="button"
        aria-controls="memory-view"
        :disabled="memoryDisabled"
        @click="chooseAction($el)"
    >
        <svg class="hub-symbol" viewBox="0 0 32 32" aria-hidden="true">
            <use href="#hud-cube"/>
        </svg>
        <span class="hub-label">Memory</span>
    </button>
    <button
        class="hub-action"
        type="button"
        aria-controls="action-panel"
        @click="chooseAction($el)"
    >
        <svg class="hub-symbol" viewBox="0 0 32 32" aria-hidden="true">
            <use href="#hud-cube"/>
        </svg>
        <span class="hub-label">Settings</span>
    </button>
    <button id="hub-back" type="button" @click="closeOrbHub()">Back</button>
</nav>
