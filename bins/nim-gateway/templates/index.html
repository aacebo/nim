<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Nim</title>
        <link rel="stylesheet" href="/web/static/index.css">
        <link rel="stylesheet" href="/web/static/orb/orb.css">
        <link rel="stylesheet" href="/web/static/chat/chat.css">
        <link rel="stylesheet" href="/web/static/memory/memory.css">
        <link rel="stylesheet" href="/web/static/dev-tools/dev-tools.css?v=4">
        <link rel="stylesheet" href="/web/static/artifacts/artifacts.css">
        <script defer src="/web/static/index.js"></script>
        <script defer src="/web/static/artifacts/artifacts.js"></script>
        <script defer src="/web/static/orb/orb.js?v=2"></script>
        <script defer src="/web/static/memory/memory.js"></script>
        <script defer src="/web/static/chat/chat.js?v=3"></script>
        <script defer src="/web/static/dev-tools/dev-tools.js?v=4"></script>
        <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
    </head>
    <body>
        <div id="nim-app" x-data="nimApp" x-cloak @keydown.window="handleKey($event)">
            <main class="orb-scene" data-hud="idle" :data-hud="hud">
                {{ self.orb|safe }}
                {{ self.chat|safe }}
                {{ self.memory|safe }}
            </main>
            {{ self.dev_tools|safe }}
            {{ self.artifacts|safe }}
        </div>
    </body>
</html>
