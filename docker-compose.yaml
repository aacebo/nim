name: nim

services:
  postgres:
    container_name: nim-postgres
    image: pgvector/pgvector:pg17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: pg_isready -U admin -d main
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    container_name: nim-nats
    image: nats:latest
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - 4222:4222
      - 8222:8222
    volumes:
      - ./nats.conf:/etc/nats/nats.conf
      - nats_data:/data

  gateway:
    container_name: nim-gateway
    image: rust:alpine
    command: sh -c "apk add musl-dev pkgconfig openssl-dev openssl-libs-static g++ && cargo run -p nim-gateway --release"
    working_dir: /app
    ports:
      - 3000:8080
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      OPENSSL_STATIC: 1
      OPENSSL_DIR: /usr
      RUST_LOG: info
      STAGINE_DIR: /app/staging
    volumes:
      - .:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  audio:
    container_name: nim-audio
    image: rust:alpine
    command: sh -c "apk add musl-dev pkgconfig openssl-dev openssl-libs-static g++ && cargo run -p nim-audio --release"
    working_dir: /app
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      OPENSSL_STATIC: 1
      OPENSSL_DIR: /usr
      RUST_LOG: info
    volumes:
      - .:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  exec:
    container_name: nim-exec
    image: rust:alpine
    command: sh -c "apk add musl-dev pkgconfig openssl-dev openssl-libs-static g++ && cargo run -p nim-exec --release"
    working_dir: /app
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      OPENSSL_STATIC: 1
      OPENSSL_DIR: /usr
      RUST_LOG: info
    volumes:
      - .:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  vision:
    container_name: nim-vision
    image: rust:alpine
    command: sh -c "apk add musl-dev pkgconfig openssl-dev openssl-libs-static g++ && cargo run -p nim-vision --release"
    working_dir: /app
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      OPENSSL_STATIC: 1
      OPENSSL_DIR: /usr
      RUST_LOG: info
    volumes:
      - .:/app
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  nats_data:
