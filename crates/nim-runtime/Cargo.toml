[package]
name = "nim-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
ai = ["dep:nim-ai", "dep:nim-state", "dep:nim-store", "dep:tokio", "dep:tracing"]

[dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
tracing = { workspace = true, optional = true }

nim-ai = { workspace = true, optional = true }
nim-state = { workspace = true, optional = true }
nim-store = { workspace = true, optional = true }
