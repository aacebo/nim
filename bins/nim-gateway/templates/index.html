<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Nim</title>
        <link rel="stylesheet" href="/web/views/index.css?v=2">
        <link rel="stylesheet" href="/web/views/orb/orb.css">
        <script defer src="/web/views/index.js?v=9"></script>
        <script defer src="/web/views/orb/orb.js?v=5"></script>
        <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
    </head>
    <body>
        <template id="orb-template">{{ self.orb|safe }}</template>
        <div id="nim-app" data-has-memories="{{ self.has_memories }}" x-data="nimApp" x-cloak @keydown.window="handleKey($event)"
            @memory-change="memoryDisabled = !$event.detail.hasMemories" @memory-available.window="memoryDisabled = false">
            <p class="view-error" role="alert" x-show="viewError" x-text="viewError"></p>
            <main class="orb-scene" data-hud="idle" :data-hud="hud">
                <nim-orb></nim-orb>
                <nim-chat></nim-chat>
                <nim-memory></nim-memory>
            </main>
            <nim-dev-tools></nim-dev-tools>
        </div>
    </body>
</html>
