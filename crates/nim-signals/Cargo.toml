[package]
name = "nim-signals"
description = "signal producer/consumer contract for nim"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

bytes = { version = "1" }
async-nats = { version = "0.50", features = ["chrono"] }
tracing-opentelemetry = { version = "0.34" }
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
