[workspace]
resolver = "3"
members = ["bins/*", "crates/*"]
default-members = ["bins/*", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["Alexander Acebo <aacebowork@gmail.com>"]
categories = []
repository = "https://github.com/aacebo/nim"

[workspace.lints.clippy]
large_enum_variant = "allow"
type_complexity = "allow"
new_without_default = "allow"
too_many_arguments = "allow"
result_large_err = "allow"
collapsible_if = "allow"

[workspace.dependencies]
axum = { version = "0.8" }
mime = { version = "0.3" }
mime_guess = { version = "2" }
heck = { version = "0.5" }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", default-features = false }
url = { version = "2" }
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_valid = { version = "2" }
tokio = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
reqwest = { version = "0.13", default-features = false }
futures-util = { version = "0.3" }

nim = { path = "crates/nim", version = "0.0.0" }
nim-ai = { path = "crates/nim-ai", version = "0.0.0" }
nim-state = { path = "crates/nim-state", version = "0.0.0" }
nim-store = { path = "crates/nim-store", version = "0.0.0" }
nim-signals = { path = "crates/nim-signals", version = "0.0.0" }
