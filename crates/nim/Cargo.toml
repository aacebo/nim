[package]
name = "nim"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
authors.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
ai = ["dep:nim-ai", "nim-runtime?/ai"]
runtime = ["dep:nim-runtime"]
audio = ["nim-ai?/audio"]
vision = ["nim-ai?/vision"]
signals = ["dep:nim-signals"]

[dependencies]
nim-state = { workspace = true }
nim-store = { workspace = true }
nim-signals = { workspace = true, optional = true }
nim-ai = { workspace = true, optional = true }
nim-runtime = { workspace = true, optional = true }
