<section id="memory-view" role="dialog" aria-modal="true" aria-labelledby="memory-title" hidden>
    <header class="memory-header">
        <div class="memory-brand">
            <svg class="memory-orb-mark" viewBox="0 0 48 48" aria-hidden="true">
                <defs>
                    <linearGradient id="archive-orb">
                        <stop stop-color="#00e7ff"/>
                        <stop offset="1" stop-color="#c45bff"/>
                    </linearGradient>
                </defs>
                <g fill="none" stroke="url(#archive-orb)" stroke-width=".65">
                    <circle cx="24" cy="24" r="20"/>
                    <ellipse cx="24" cy="24" rx="12" ry="20" transform="rotate(32 24 24)"/>
                    <ellipse cx="24" cy="24" rx="12" ry="20" transform="rotate(-32 24 24)"/>
                    <ellipse cx="24" cy="24" rx="20" ry="9"/>
                    <ellipse cx="24" cy="24" rx="20" ry="15"/>
                    <ellipse cx="24" cy="24" rx="5" ry="20"/>
                </g>
            </svg>
            <span>NIM</span>
            <span class="memory-brand-archive">Archive</span>
        </div>
        <div class="memory-controls">
            <div class="memory-modes" role="group" aria-label="Memory view">
                <button
                    id="memory-timeline-toggle"
                    type="button"
                    aria-pressed="true"
                    aria-controls="memory-timeline-stage"
                    @click="setMemoryTopology('timeline')"
                >
                    Timeline
                </button>
                <button
                    id="memory-graph-toggle"
                    type="button"
                    aria-pressed="false"
                    aria-controls="memory-graph"
                    @click="setMemoryTopology('graph')"
                >
                    Graph
                </button>
            </div>
            <button id="memory-back" type="button" @click="backToHub()">
                <span aria-hidden="true">←</span> Back
            </button>
        </div>
    </header>
    <div class="memory-heading">
        <p class="memory-kicker">Memory</p>
        <h2 id="memory-title">Timeline</h2>
        <p id="memory-subtitle">Your memories in time</p>
    </div>
    <div id="memory-timeline-stage">
        <canvas id="memory-timeline-strand" aria-hidden="true"></canvas>
        <div id="memory-timeline" role="region" aria-label="Memory timeline">
            <ol id="memory-strand"></ol>
        </div>
        <div class="memory-selection" aria-hidden="true">
            <div class="memory-selection-index">
                <span id="memory-selection-index"></span>
                <span>Record</span>
            </div>
            <div class="memory-selection-copy">
                <span class="memory-selection-kicker">Memory sequence</span>
                <strong id="memory-selection-title"></strong>
                <span id="memory-selection-type"></span>
                <span id="memory-selection-date"></span>
            </div>
        </div>
        <div class="memory-time-axis" aria-hidden="true">
            <span id="memory-axis-start"></span>
            <span id="memory-axis-end"></span>
        </div>
    </div>
    <div id="memory-graph" role="region" aria-label="Memory relations graph" tabindex="0" hidden>
        <div class="memory-graph-surface">
            <svg id="memory-edges" viewBox="0 0 1040 620" aria-hidden="true"></svg>
            <div id="memory-nodes"></div>
        </div>
    </div>
    <footer class="memory-footer">
        <span>◇ &nbsp; Stored memories</span>
        <span id="memory-view-status" role="status"></span>
    </footer>
    <section id="memory-details" role="region" aria-labelledby="memory-detail-title" hidden>
        <div class="memory-detail-header">
            <p class="memory-kicker">Memory record</p>
            <button
                id="memory-detail-close"
                type="button"
                aria-label="Close memory details"
                @click="dismissMemoryDetails()"
            >
                ×
            </button>
        </div>
        <h3 id="memory-detail-title"></h3>
        <div id="memory-detail-art" aria-hidden="true" hidden></div>
        <p id="memory-detail-meta"></p>
        <p id="memory-detail-summary"></p>
        <button id="memory-expand" type="button" hidden @click="expandMemoryGraph()">Expand relations</button>
    </section>
</section>
