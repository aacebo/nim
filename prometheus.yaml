global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]

  - job_name: nim-resources
    scrape_interval: 10s
    static_configs:
      - targets: ["telegraf:9273"]
