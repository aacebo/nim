[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  container_state_include = ["running"]
  perdevice_include = []
  total_include = ["cpu", "network", "blkio"]
  docker_label_include = ["com.docker.compose.project", "com.docker.compose.service"]
  tag_env = []
  namepass = ["docker_container_cpu", "docker_container_mem", "docker_container_net", "docker_container_blkio"]
  fieldinclude = ["usage_percent", "usage", "limit", "rx_bytes", "tx_bytes", "io_service_bytes_recursive_read", "io_service_bytes_recursive_write", "container_id"]
  taginclude = ["com.docker.compose.project", "com.docker.compose.service", "container_name", "cpu", "network", "device"]

  [inputs.docker.tagpass]
    "com.docker.compose.project" = ["${COMPOSE_PROJECT_NAME}"]

[[processors.rename]]
  [[processors.rename.replace]]
    tag = "com.docker.compose.project"
    dest = "compose_project"

  [[processors.rename.replace]]
    tag = "com.docker.compose.service"
    dest = "compose_service"

  [[processors.rename.replace]]
    field = "rx_bytes"
    dest = "rx_bytes_total"

  [[processors.rename.replace]]
    field = "tx_bytes"
    dest = "tx_bytes_total"

  [[processors.rename.replace]]
    field = "io_service_bytes_recursive_read"
    dest = "io_service_bytes_recursive_read_total"

  [[processors.rename.replace]]
    field = "io_service_bytes_recursive_write"
    dest = "io_service_bytes_recursive_write_total"

[[outputs.prometheus_client]]
  listen = ":9273"
  expiration_interval = "30s"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true

  [outputs.prometheus_client.metric_types]
    counter = ["docker_container_net_rx_bytes_total", "docker_container_net_tx_bytes_total", "docker_container_blkio_io_service_bytes_recursive_read_total", "docker_container_blkio_io_service_bytes_recursive_write_total"]

  [outputs.prometheus_client.tagpass]
    compose_service = ["gateway", "text", "audio", "vision", "encode", "sleep"]
